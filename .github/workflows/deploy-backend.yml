name: Deploy Backend

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::253650698585:role/github-actions-brukh
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image
        run: |
          IMAGE_URI=253650698585.dkr.ecr.us-east-1.amazonaws.com/brukhy-backend:latest
          docker build -t $IMAGE_URI ./backend
          docker push $IMAGE_URI

      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster brukhy-cluster \
            --service backend-service \
            --force-new-deployment \
           --region us-east-1
