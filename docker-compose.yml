services:
  backend:
    container_name: backend-app
    build:
      context: ./backend
#      dockerfile: ./backend/Dockerfile
#    volumes:
#      - .:/app
    networks:
      - realworld
    ports:
      - "5000:5000"
    environment:
      SHELL: /bin/bash
      FLASK_APP: "realworld.app"
#      FLASK_APP: ${FLASK_APP:-realworld.app}
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_RUN_PORT: ${FLASK_RUN_PORT:-5000}
      POSTGRES_DB: ${POSTGRES_DB:-postgres-db}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      FLASK_DEBUG: 1
    depends_on:
      - postgres
    command: >
      sh -c "alembic upgrade head && flask run --host=0.0.0.0 --port=5000"
#    command: >
#      sh -c "flask db upgrade && flask run --host=0.0.0.0"
#    command: flask run --host=0.0.0.0
#    stdin_open: true
#    tty: true

  postgres:
    image: postgres:15
    container_name: postgres-db
#    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres-db}
      POSTGRES_USER: ${POSTGRES_USER:-testuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
#    healthcheck:
#      test: ["CMD", "pg_isready"]
#      interval: 10s
#      timeout: 30s
#      retries: 5
    ports:
      - "5432:5432"
    networks:
      - realworld

  frontend:
    build:
      context: ./frontend
    container_name: frontend-app
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      VITE_API_HOST: http://realworld:5000/api
    networks: 
      - realworld
#    working_dir: /app
#    command: yarn dev --host 0.0.0.0
#    stdin_open: true
#    tty: true

networks:
  realworld:
    name: "realworld"
